apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: suman-devops-app
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/psumankotha-sys/My-First-Lab
    targetRevision: HEAD
    path: .

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true