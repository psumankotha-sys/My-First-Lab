name: Suman First Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Say Hello
        run: echo "Build successful!"

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Run Test
        run: echo "Tests passed!"

  deploy:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Deploy
        run: echo "Deployed successfully!"