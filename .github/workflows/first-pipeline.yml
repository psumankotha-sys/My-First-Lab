name: Suman DevOps - Full Pipeline

on:
  push:
    branches: [ main ]

jobs:

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
      - name: Build step
        run: echo "Building the application..."

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
      - name: Run tests
        run: echo "All tests passed!"

  docker:
    name: Docker Build and Push
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build -t sumankotha/suman-devops:latest .
          docker tag sumankotha/suman-devops:latest sumankotha/suman-devops:${{ github.sha }}

      - name: Push to Docker Hub
        run: |
          docker push sumankotha/suman-devops:latest
          docker push sumankotha/suman-devops:${{ github.sha }}

  deploy-to-eks:
    name: Deploy to AWS EKS
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Verify AWS Connection
        run: aws sts get-caller-identity

      - name: Update kubeconfig for EKS
        run: |
          aws eks update-kubeconfig \
            --region ${{ secrets.AWS_REGION }} \
            --name ${{ secrets.EKS_CLUSTER_NAME }}

      - name: Verify kubectl Connection
        run: kubectl get nodes

      - name: Deploy to EKS
        run: |
          kubectl apply -f deployment.yml --validate=false
          kubectl apply -f service.yml --validate=false
          kubectl apply -f configmap.yml --validate=false

      - name: Update Image Version
        run: |
          kubectl set image deployment/suman-deployment \
            suman-app=sumankotha/suman