name: Suman DevOps - Full Pipeline

on:
  push:
    branches: [ main ]

jobs:

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
      - name: Build step
        run: echo "Building the application..."

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
      - name: Run tests
        run: echo "All tests passed!"

  docker:
    name: Docker Build and Push
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: docker build -t sumankotha/suman-devops:latest .

      - name: Push to Docker Hub
        run: docker push sumankotha/suman-devops:latest

  kubernetes-deploy:
    name: Kubernetes Deploy
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Check K8s manifest files exist
        run: |
          echo "Checking manifest files exist..."
          ls -la deployment.yml service.yml configmap.yml
          echo "All manifest files found!"

      - name: Validate YAML syntax
        run: |
          echo "Checking YAML syntax..."
          cat deployment.yml
          cat service.yml
          cat configmap.yml
          echo "YAML files look good!"

      - name: Simulate Kubernetes Deploy
        run: |
          echo "=========================================="
          echo "  Suman DevOps - Kubernetes Deploy"
          echo "=========================================="
          echo "Image: sumankotha/suman-devops:latest"
          echo "Namespace: default"
          echo "Replicas: 2"
          echo "ConfigMap: suman-config"
          echo "Service: suman-service"
          echo "Status: Simulated deployment successful!"
          echo "=========================================="
          echo "NOTE: Real deploy needs cloud K8s - Option B"