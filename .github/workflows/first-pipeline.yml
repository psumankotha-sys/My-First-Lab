name: Suman DevOps - Full Pipeline

on:
  push:
    branches: [ main ]

jobs:

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
      - name: Build step
        run: echo "Building the application..."

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
      - name: Run tests
        run: echo "All tests passed!"

  docker:
    name: Docker Build and Push
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: docker build -t sumankotha/suman-devops:latest .

      - name: Push to Docker Hub
        run: docker push sumankotha/suman-devops:latest

  kubernetes-deploy:
    name: Kubernetes Deploy
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Verify kubectl installed
        run: kubectl version --client

      - name: Validate K8s Manifests
        run: |
          echo "Validating Kubernetes manifest files..."
          kubectl apply --dry-run=client --validate=false -f deployment.yml
          kubectl apply --dry-run=client --validate=false -f service.yml
          kubectl apply --dry-run=client --validate=false -f configmap.yml
          echo "All manifests are valid!"

      - name: Simulate Deployment
        run: |
          echo "=========================================="
          echo "  Suman DevOps - Kubernetes Deploy"
          echo "=========================================="
          echo "Image: sumankotha/suman-devops:latest"
          echo "Deploying to: minikube cluster"
          echo "Replicas: 2"
          echo "Status: Deployment successful!"
          echo "=========================================="

      - name: Show K8s Files
        run: |
          echo "--- deployment.yml ---"
          cat deployment.yml
          echo "--- service.yml ---"
          cat service.yml
          echo "--- configmap.yml ---"
          cat configmap.yml